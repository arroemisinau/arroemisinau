<script>
/* Palet lembut & elegan: hijau pinus, sage, champagne-gold, mawar debu, krem hangat */
const _mix=(h,t,k)=>{const n=parseInt(h.slice(1),16),r=[n>>16&255,n>>8&255,n&255],o=r.map(v=>Math.round(v+(t-v)*k));return '#'+o.map(v=>v.toString(16).padStart(2,'0')).join('');};
const _ramp=h=>({50:_mix(h,255,.89),100:_mix(h,255,.78),200:_mix(h,255,.6),300:_mix(h,255,.4),400:_mix(h,255,.26),500:h,600:_mix(h,0,.13),700:_mix(h,0,.3),800:_mix(h,0,.44),900:_mix(h,0,.58),950:_mix(h,0,.7)});
const _pine=_ramp('#0E9F8E'), _sage=_ramp('#2FB462'), _gold=_ramp('#F5A60B'), _rose=_ramp('#E8466F'), _plum=_ramp('#7C5CE0'), _teal=_ramp('#12A8B8'), _terra=_ramp('#F2703A'), _dusty=_ramp('#DB4FA0');
const _warm={50:'#F5FAF9',100:'#EAF3F1',200:'#D5E6E2',300:'#B9D0CB',400:'#8CA8A2',500:'#667F7A',600:'#4F6661',700:'#3C504C',800:'#2B3C39',900:'#1D2B28',950:'#121C1A'};
tailwind.config = { theme: { extend: { colors: {
  sky: _pine, indigo: _pine, blue: _pine, emerald: _sage, green: _sage, lime: _sage,
  amber: _gold, yellow: _gold, rose: _rose, red: _rose, violet: _plum, purple: _plum,

} } } };

<style id="pageStyle"></style>
<style>
:root{--ink:#1F2E2B;--ink2:#566A66;--ivory:#EEF8F6;--line:#D6EAE5;--line2:#BCDAD3;--green:#0E9F8E;--green-d:#08695E;--green-h:#0B867A;--gold:#FFB020;--gold-h:#E8990A;--goldl:#FFE2A3;--ring:rgba(14,159,142,.28);--hdr1:#0E9F8E;--hdr2:#0A6F8C;--tint:#FFF0C7;--tint-ink:#8A5300;--sage:#2FB462;--rose:#E8466F;--shadow:0 1px 2px rgba(10,80,70,.06),0 12px 28px -14px rgba(10,80,70,.22)}
html{-webkit-text-size-adjust:100%}

h1,h2,h3,.font-display{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;letter-spacing:.005em}
.app-header{background:linear-gradient(135deg,var(--hdr1) 0%,var(--hdr2) 100%);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;border-bottom:5px solid var(--gold);box-shadow:0 10px 26px -14px rgba(10,60,55,.55)}

.app-header .t{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:32px;line-height:1.1;letter-spacing:.015em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.18);text-decoration:none}
.app-header .s{display:block;font-size:13px;color:rgba(255,255,255,.92);margin-top:3px;letter-spacing:.03em}
.wa-link{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 16px 6px 10px;border-radius:999px;background:#fff;color:var(--green-d);font-weight:700;font-size:14px;letter-spacing:.03em;text-decoration:none;border:1px solid var(--goldl);transition:background .15s,border-color .15s}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

.btn-danger{background:var(--rose);color:#fff}.btn-danger:hover{background:#D33A62}

.btn-light{background:#fff;color:var(--green-d);border:1px solid var(--line2)}.btn-light:hover{background:#FBF8F1;border-color:var(--gold);box-shadow:none}

.app-header .btn-ok{background:#fff;border-color:#fff;color:#1C7A41}.app-header .btn-light{border-color:transparent;font-weight:700}.app-header .btn-light:hover{background:var(--goldl)}.app-header .btn-warn{background:var(--gold);color:#3A2600;border-color:var(--gold)}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:8px}

.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--ring)}

.grid-kelas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin-top:20px}
.card-kelas{transition:transform .2s,border-color .2s,box-shadow .2s;display:block;background:#fff;border-radius:18px;padding:26px 16px 22px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,box-shadow .2s;color:inherit;text-decoration:none;position:relative}

.grid-mapel{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card-mapel{background:#fff;border-radius:16px;padding:16px 18px;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:border-color .2s,box-shadow .2s;display:flex;justify-content:space-between;align-items:center;gap:12px;color:inherit;text-decoration:none}

.card-mapel small{color:var(--ink2);font-size:13px}
.mapel-ico{flex:none;width:56px;height:56px;border-radius:14px;background:#FCFAF5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.7rem;overflow:hidden}
.mapel-ico img{width:100%;height:100%;object-fit:contain;padding:5px}

.modul-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;margin-bottom:10px;gap:12px;flex-wrap:wrap;background:#FBF6EA;color:inherit;text-decoration:none}

a.modul-item.ujian:hover,a.modul-item.paket-html:hover{border-color:var(--gold)}
.prose-sd{font-size:16.5px;line-height:1.8}
.prose-sd p{margin:.55rem 0}

@media(max-width:600px){.qimg{max-height:240px}.html-frame{min-height:68vh}.sbox{padding:18px}.sbox>h2{font-size:22px}}

/* ===== Portal Akun: cover, login, dashboard, keuangan ===== */
.cover-hero{position:relative;border-radius:22px;overflow:hidden;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;color:#fff;box-shadow:var(--shadow);background-color:var(--hdr1);background-image:radial-gradient(circle at 16% 24%,rgba(255,255,255,.2) 0 90px,transparent 91px),radial-gradient(circle at 84% 78%,rgba(255,255,255,.15) 0 140px,transparent 141px),linear-gradient(135deg,var(--hdr1),var(--hdr2));background-size:cover;background-position:center}
.cover-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,38,36,.25),rgba(4,38,36,.62))}
.cover-hero .in{position:relative;max-width:780px}
.cover-hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(30px,5.2vw,52px);line-height:1.12;font-weight:700;margin:0;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.cover-hero p{margin:6px auto 0;font-size:17px;max-width:660px;color:rgba(255,255,255,.96);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.login-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:22px}
.login-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border:1px solid var(--line);border-top:6px solid var(--lc);border-radius:18px;padding:24px 18px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink);transition:transform .2s,box-shadow .2s}

.login-card b{font-size:18px}.login-card small{color:var(--ink2);font-size:13px}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:6px}
.tile{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--tc,var(--green));border-radius:18px;padding:20px;box-shadow:var(--shadow);cursor:pointer;color:inherit;text-decoration:none;text-align:left;font:inherit;transition:transform .2s,box-shadow .2s}

.stat small{display:block;font-size:12.5px;font-weight:700;color:var(--ink2)}.stat b{font-size:22px;color:var(--ink)}
.fin-item{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:6px solid var(--fc,var(--green));border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.fin-item.no{--fc:#E8466F}.fin-item.ok{--fc:#2FB462}.fin-item.pr{--fc:#7C5CE0}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}

/* ===== Login pop up & mobile ===== */
.login-actions{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:6px}
.btn-block{width:100%;padding:14px 18px;font-size:16px;border-radius:14px}
.btn-link{background:none;border:0;color:var(--ink2);font-weight:600;font-size:14px;padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.mat-bar{height:9px;border-radius:99px;background:#F1E4E6;overflow:hidden}.mat-bar>i{display:block;height:100%;background:linear-gradient(90deg,#F08A0C,#E8466F);border-radius:99px}
.rk-poin{font-weight:800}.rk-poin small{font-weight:600;color:var(--ink2)}
@media(max-width:640px){
  .rk-table thead{display:none}
  .rk-table,.rk-table tbody{display:block;width:100%}
  .rk-table tr{display:block;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}

  .rk-table td::before{content:attr(data-l);font-weight:700;font-size:12px;color:var(--ink2);text-align:left;flex-shrink:0}

  .login-grid{grid-template-columns:1fr 1fr;gap:12px}.login-card{padding:16px 10px}.login-card .ic{width:52px;height:52px;font-size:26px}.login-card b{font-size:15px}
}

/* ===== Pendaftaran Tentor & Murid ===== */
a.login-card{text-decoration:none}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}

.kbadge{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px}.kbadge.ok{background:#DDF5E6;color:#1C7A41}.kbadge.full{background:#FDE3E8;color:#B3243F}
.kchip{display:inline-block;background:#E7F4F1;color:#08695E;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin:0 4px 4px 0}

.kact{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-cta{background:var(--gold);color:#3A2600;border-color:var(--gold);font-weight:800;padding:12px 26px;font-size:15px;border-radius:999px;box-shadow:0 10px 22px -10px rgba(0,0,0,.45)}
.btn-cta:hover{background:var(--goldl)}
.fsec>h2 .fnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 16px}
.fgrid .full{grid-column:1/-1}
.fld.bad .inp{border-color:var(--rose);box-shadow:0 0 0 3px rgba(232,70,111,.15)}
.fld.bad .pickgrid,.fld.bad .upl{outline:2px solid rgba(232,70,111,.55);outline-offset:4px;border-radius:12px}
.field-err{color:#C42B52;font-size:12.5px;font-weight:700;margin-top:4px}
.field-err:empty{display:none}
.fhint{font-size:12.5px;color:var(--ink2);margin-top:4px}
textarea.inp{resize:vertical;min-height:44px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pick{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;font-weight:600;font-size:14.5px;line-height:1.4;transition:border-color .15s,background .15s}
.pick input{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex:none}
.pick:hover{border-color:var(--gold)}
.pick:has(input:checked){border-color:var(--green);background:var(--ivory);box-shadow:0 0 0 2px var(--ring)}
.pick.dis{opacity:.45;cursor:not-allowed}
.pick small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px}
.subpanel{margin-top:10px;padding:14px;border:1px dashed var(--line2);border-radius:14px;background:var(--ivory)}
.upl{border:2px dashed var(--line2);border-radius:14px;padding:14px;background:#fff}
.fotobox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px}
.fotoprev{width:112px;height:140px;object-fit:cover;border-radius:12px;border:1px solid var(--line2);background:var(--ivory)}
.fotoph{width:112px;height:140px;border-radius:12px;border:1px dashed var(--line2);background:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--line2)}
.agree{background:#FFFBEF;border:1px solid var(--goldl);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.7}
.agree ol{list-style:decimal;padding-left:1.3rem;margin:.4rem 0 0}
.agree li{margin:.25rem 0}
.sumgrid{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:6px 14px;font-size:14px;margin:0}
.sumgrid dt{font-weight:700;color:var(--ink2)}
.sumgrid dd{margin:0;word-break:break-word;white-space:pre-wrap}
.sumh{margin:14px 0 6px;font-weight:800;color:var(--green-d);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sumh:first-child{margin-top:0}
.stbadge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;background:var(--bc,var(--green))}
@media(max-width:520px){.sumgrid{grid-template-columns:1fr;gap:0}.sumgrid dt{margin-top:8px}}
</style>

  if (/\[SOAL\]/i.test(cleanText)) {
    return parseBulk(cleanText)
      .filter(x => x.q && x.options.length >= 2)
      .map(x => ({
        q: x.q,
        options: x.options,
        key: x.key >= 0 && x.key < x.options.length ? x.key : 0,
        pembahasan: x.pembahasan || '',
        img: x.img || ''
      }));
  }

  const results = [];
  let cur = null;

  const pushCurrent = () => {
    if (!cur) return;
    const qText = cur.qLines.join('\n').trim();
    const opts = cur.options.map(o => o.trim()).filter(Boolean);
    if (qText && opts.length >= 2) {
      const safeKey = (cur.key >= 0 && cur.key < opts.length) ? cur.key : 0;
      results.push({
        q: qText,
        options: opts,
        key: safeKey,
        pembahasan: cur.pembahasan.trim(),
        img: ''
      });
    }
    cur = null;
  };

  for (const line of lines) {
    const keyMatch = line.match(/^(?:kunci(?:\s+jawaban)?|jawaban|pembahasan\s*\/\s*kunci)\s*[:=]\s*\(?([A-Ea-e])\)?\b/i);
    if (keyMatch && cur) {
      const idx = LET.indexOf(keyMatch[1].toUpperCase());
      if (idx >= 0) cur.key = idx;
      const rest = line.replace(/^(?:kunci(?:\s+jawaban)?|jawaban)\s*[:=]\s*\(?[A-Ea-e]\)?\s*/i, '').trim();
      if (rest) cur.pembahasan = cur.pembahasan ? (cur.pembahasan + '\n' + rest) : rest;
      continue;
    }

    const bahasMatch = line.match(/^pembahasan\s*[:=]\s*(.+)$/i);
    if (bahasMatch && cur) {
      cur.pembahasan = cur.pembahasan ? (cur.pembahasan + '\n' + bahasMatch[1].trim()) : bahasMatch[1].trim();
      continue;
    }

    const optMatch = line.match(/^([A-Ea-e])\s*[.)\-:]\s*(.+)$/);
    if (optMatch && cur) {
      const letter = optMatch[1].toUpperCase();
      const optIdx = LET.indexOf(letter);
      const optVal = optMatch[2].trim();
      if (optIdx >= 0 && optIdx <= cur.options.length) {
        cur.options[optIdx] = optVal;
        cur.lastOptIdx = optIdx;
        continue;
      }
    }

    const qStartMatch = line.match(/^(?:soal|no\.?|nomor)?\s*(\d{1,3})\s*[.):]\s+(.+)$/i);
    if (qStartMatch) {
      const num = parseInt(qStartMatch[1], 10);
      const body = qStartMatch[2].trim();
      if (!cur || cur.options.length >= 2 || (num === cur.expectedNextNo && body.length > 2)) {
        pushCurrent();
        cur = {
          num,
          expectedNextNo: num + 1,
          qLines: [body],
          options: [],
          lastOptIdx: -1,
          key: 0,
          pembahasan: ''
        };
        continue;
      }
    }

    if (cur) {
      if (cur.lastOptIdx >= 0 && cur.options[cur.lastOptIdx] !== undefined && !cur.pembahasan) {
        cur.options[cur.lastOptIdx] += ' ' + line;
      } else if (!cur.options.length) {
        cur.qLines.push(line);
      } else {
        cur.pembahasan = cur.pembahasan ? (cur.pembahasan + '\n' + line) : line;
      }
    }
  }

  pushCurrent();
  return results;
}

/* ---- Koneksi akun tentor ke Supabase ---- */
const TENTOR_SQL_HINT = 'Tabel "akun_tentor" belum ada / belum diberi izin di Supabase. Jalankan file supabase_akun_tentor.sql di Supabase → SQL Editor.';
function tentorErrMsg(err) {
  const m = String((err && (err.message || err.details || err.hint)) || err || '');
  const c = String((err && err.code) || '');
  if (/PGRST205|42P01|schema cache|does not exist|relation/i.test(m + ' ' + c)) return TENTOR_SQL_HINT;
  if (/42501|row-level security|permission denied|policy/i.test(m + ' ' + c)) return 'Akses ditolak (RLS) pada tabel akun_tentor. Tambahkan policy lewat supabase_akun_tentor.sql.';
  if (/PGRST204|column/i.test(m + ' ' + c)) return 'Kolom tabel akun_tentor tidak sesuai. Jalankan ulang supabase_akun_tentor.sql.';
  if (/fetch|network|Failed to fetch|timeout/i.test(m)) return 'Tidak ada koneksi internet / Supabase tidak terjangkau.';
  return m || 'Kesalahan tidak diketahui';
}
async function refreshAkunTentor() {
  try {
    const { data, error } = await sb.rpc('app_ambil', { p_token: tok(), p_store: 'akun_tentor' });
    if (error) { window._tentorCloudError = tentorErrMsg(error); return { ok: false, error: window._tentorCloudError }; }
    window._tentorCloudError = '';
    const remote = (data || []).map(r => fromSupabaseRow('akun_tentor', r));
    const old = DB.akun_tentor || [];
    // jangan hapus akun lokal yang belum sempat terkirim ke cloud
    const remoteIds = new Set(remote.map(x => x.id));
    const pending = old.filter(x => !remoteIds.has(x.id) && window._tentorPending && window._tentorPending.has(x.id));
    const merged = [...remote, ...pending];
    DB.akun_tentor = merged;
    await persist(() => tx('akun_tentor', 'readwrite', st => { st.clear(); merged.forEach(o => st.put(o)); }));
    return { ok: true };
  } catch (e) {
    window._tentorCloudError = tentorErrMsg(e);
    return { ok: false, error: window._tentorCloudError };
  }
}
async function submitTentorLogin(e) {
  e.preventDefault();
  const u = ($('#t_user').value || '').trim(), p = ($('#t_pin').value || '').trim();
  const btn = e.submitter || e.target.querySelector('button[type=submit]');
  if (btn) { btn.disabled = true; btn.textContent = 'Memeriksa...'; }
  let r; try { r = await rpcLogin('tentor', u, p); } catch (err) { r = { ok: false, err: 'Tidak terhubung ke server: ' + (err.message || err) }; }
  if (btn) { btn.disabled = false; btn.textContent = 'Masuk Tentor'; }
  if (!r || !r.ok) return toast((r && r.err) || 'Login gagal', 'err');
  sessionStorage.removeItem('admin'); localStorage.removeItem('murid_akun_id');
  setTok(r.token, false);
  try { await pullAllFromSupabase(); } catch (err) { console.warn(err); }
  sessionStorage.setItem('tentor_akun_id', r.id);
  closeModal();
  toast(`Login Tentor berhasil: ${r.nama}`, 'ok');
  location.hash = '#/';
  render();
}

async function saveAkunTentor(e, id) {
  e.preventDefault();
  syncTmpTentorMapel();
  const nama = ($('#at_nama').value || '').trim();
  const username = ($('#at_user').value || '').trim();
  const pin = ($('#at_pin').value || '').trim();
  const aktif = !!$('#at_aktif').checked;
  const allowedMapelIds = [...(window._tmpTentorMapel || new Set())];
  const kelasSet = new Set();
  allowedMapelIds.forEach(mid => {
    const mp = get('mapel', mid);
    if (mp && mp.kelasId) kelasSet.add(String(mp.kelasId));
  });

  if (!nama || !username || (!pin && !get('akun_tentor', id))) return toast('Nama, username, dan PIN wajib diisi', 'err');

  const duplicate = (DB.akun_tentor || []).find(a =>
    String(a.username || '').trim().toLowerCase() === username.toLowerCase() && a.id !== id
  );
  if (duplicate) return toast('Username tentor tersebut sudah dipakai', 'err');

  const obj = {
    id: id || ('tnt_' + uid()),
    nama,
    username,
    pin,
    allowedKelasIds: [...kelasSet],
    allowedMapelIds,
    muridIds: [...(window._tmpTentorMurid || new Set())],
    aktif,
    updatedAt: new Date().toISOString()
  };
  window._tentorPending = window._tentorPending || new Set();
  window._tentorPending.add(obj.id);
  let cloudOk = true;
  try { await put('akun_tentor', obj); window._tentorPending.delete(obj.id); }
  catch (err) { cloudOk = false; window._tentorCloudError = tentorErrMsg(err); }
  closeModal();
  if (cloudOk) toast('Akun tentor & mapel ampu tersimpan', 'ok');
  else toast('Tersimpan di perangkat ini saja, GAGAL ke server: ' + window._tentorCloudError, 'err');

function getUnlockedGrades() {
  try {
    const arr = JSON.parse(sessionStorage.getItem('unlocked_grades') || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function unlockGradeLocally(kelasId) {
  const list = new Set(getUnlockedGrades());
  list.add(String(kelasId));
  sessionStorage.setItem('unlocked_grades', JSON.stringify([...list]));
}
function isGradeLocked(kelasId) {
  if (isAdmin() || isTentor()) return false;
  const acc = getMuridSession();
  if (acc && acc.kelasId === kelasId) return false;
  const k = get('kelas', kelasId);
  if (!k || !k.kunciAktif) return false;
  return !getUnlockedGrades().includes(String(kelasId));
}
function getKelasIdFromRoute(route, id) {
  if (route === 'kelas') return id;
  if (route === 'mapel') { const m = get('mapel', id); return m ? m.kelasId : null; }
  if (route === 'bab') { const b = get('bab', id); const m = b && get('mapel', b.mapelId); return m ? m.kelasId : null; }
  if (route === 'ujian') { const u = get('ujian', id); const m = u && get('mapel', u.mapelId); return m ? m.kelasId : null; }
  if (route === 'paket-html') { const p = get('paket_html', id); return p ? p.kelasId : null; }
  return null;
}
function tryOpenGrade(event, kelasId, targetHash) {
  if (!isAdmin() && isGradeLocked(kelasId)) {
    if (event) event.preventDefault();
    openGradeKeyModal(kelasId, targetHash);
    return false;
  }
  return true;
}
function openGradeKeyModal(kelasId, targetHash) {
  const k = get('kelas', kelasId);
  if (!k) return;
  openModal(`<form class="p-6 space-y-4" onsubmit="submitGradeKey(event,'${esc(kelasId)}','${esc(targetHash || '')}')">
    <div class="text-center">
      <div class="text-5xl">🔐</div>
      <h3 class="font-extrabold text-2xl mt-1">Kunci ${esc(k.nama)}</h3>
      <p class="text-slate-500 text-sm mt-1">Masukkan kunci akses khusus untuk membuka materi &amp; soal ${esc(k.nama)}.</p>
    </div>
    <div>
      <label class="lbl">Kunci Kelas</label>
      <input id="grade_key_input" type="password" autocomplete="off" class="inp text-center text-xl tracking-wider" required placeholder="Masukkan kunci kelas...">
    </div>
    <div class="login-actions">
      <button type="submit" class="btn btn-primary btn-block">🔓 Buka Kelas</button>
      <button type="button" class="btn-link" onclick="closeModal(); if(location.hash!=='#/') location.hash='#/';">Kembali</button>
    </div>
  </form>`);
  setTimeout(() => { const el = $('#grade_key_input'); if (el) el.focus(); }, 60);
}
async function submitGradeKey(e, kelasId, targetHash) {
  e.preventDefault();
  const inputKey = ($('#grade_key_input').value || '').trim();
  const k = get('kelas', kelasId);
  let valid = false;

  try {
    const { data, error } = await sb.rpc('verify_grade_key', {
      p_kelas_id: kelasId,
      p_key: inputKey
    });
    if (!error && typeof data === 'boolean') valid = data;
  } catch (err) {
    console.warn('RPC verify_grade_key fallback:', err);
  }

  if (!valid) {
    toast('Kunci kelas salah! Periksa kembali kunci yang diberikan guru.', 'err');
    $('#grade_key_input').value = '';
    $('#grade_key_input').focus();
    return;
  }

  unlockGradeLocally(kelasId);
  closeModal();
  toast(`${k ? k.nama : 'Kelas'} berhasil dibuka!`, 'ok');
  if (targetHash && location.hash !== targetHash) location.hash = targetHash;
  else render();
}

function buildSeed() {
  const out = { kelas: [], mapel: [], bab: [], soal: [], ujian: [], modul: [], paket_html: [], gambar: [], hasil: [], akun_murid: [], akun_tentor: [], tagihan: [], presensi: [], fee_tentor: [] };
  for (let n = 1; n <= 12; n++) {
    const kid = 'k' + n;
    out.kelas.push({ id: kid, nama: 'Kelas ' + n, urutan: n, accessKey: '', kunciAktif: false });
    MAPEL_DEFAULT.forEach((md, i) => {
      const mid = `m${n}-${i}`;
      out.mapel.push({ id: mid, kelasId: kid, nama: md.nama, ikon: md.ikon, warna: md.warna, urutan: i + 1 });
      const uj = {};
      JENIS.forEach(j => { const u = { id: `u${n}-${i}-${j.k}`, mapelId: mid, jenis: j.k, soalIds: [], cfg: { acakSoal: true, acakOpsi: false, durasi: 0 } }; uj[j.k] = u; out.ujian.push(u); });
      const babs = (SEED[n] && SEED[n][md.nama]) || [];
      babs.forEach((b, bi) => {
        const bid = `b${n}-${i}-${bi + 1}`;
        out.bab.push({ id: bid, mapelId: mid, nama: b.n, urutan: bi + 1, ringkasan: b.r.join('\n'), cfg: { acakSoal: false, acakOpsi: false, durasi: 0 } });
        b.s.forEach((x, si) => {
          const sid = `s${n}-${i}-${bi + 1}-${si + 1}`;
          out.soal.push({ id: sid, scope: 'bab', parentId: bid, q: x[0], options: x[1], key: x[2], pembahasan: x[3] || '', img: '', optImgs: [] });
          if (bi === 0) uj.ASTS1.soalIds.push(sid);
          uj.ASAS1.soalIds.push(sid);
        });
      });
    });

  return out;
}

let cloudMute = false;
async function pushToSupabase(store, objs) {
  if (cloudMute || !objs.length) return;
  const rows = objs.map(o => toSupabaseRow(store, o));
  try { await rpcTulis(store, rows); }
  catch (error) {
    console.error('Supabase tulis error (' + store + '):', error);
    if (!PORTAL_STORES.includes(store)) toast('Gagal sinkron ke server (' + store + '): ' + (error.message || error), 'warn');
    throw error;
  }
}
async function deleteFromSupabase(store, ids) {
  if (cloudMute || !ids.length) return;
  const { error } = await sb.rpc('app_hapus', { p_token: tok() || null, p_store: store, p_ids: ids });
  if (error) { console.error('Supabase hapus error (' + store + '):', error); toast('Gagal hapus di server (' + store + '): ' + error.message, 'warn'); throw error; }
}

const hasilPending = () => { try { return JSON.parse(localStorage.getItem('hasil_pending') || '[]'); } catch (e) { return []; } };
const hasilPendingSet = ids => { try { localStorage.setItem('hasil_pending', JSON.stringify([...new Set(ids)])); } catch (e) { } };
const hasilPendingAdd = id => hasilPendingSet([...hasilPending(), id]);
async function retryHasilPending() {
  const ids = hasilPending(); if (!ids.length || !tok()) return 0;
  const recs = (DB.hasil || []).filter(h => ids.includes(h.id));
  if (!recs.length) { hasilPendingSet([]); return 0; }
  try { await rpcTulis('hasil', recs.map(o => toSupabaseRow('hasil', o))); hasilPendingSet([]); return recs.length; }
  catch (err) { window._hasilErr = (err && (err.message || err.details)) || String(err); return -1; }
}
async function kirimUlangHasil() {
  const n = await retryHasilPending();
  if (n > 0) toast(n + ' nilai berhasil dikirim ke server', 'ok');
  else if (n < 0) toast('Masih gagal: ' + window._hasilErr, 'err');
  render();
}
async function pullAllFromSupabase() {
  const next = {};
  window._portalCloudError = '';
  for (const st of STORES) {
    const PROT = ['hasil', 'akun_murid', 'akun_tentor', 'tagihan', 'presensi', 'fee_tentor'];
    if (st === 'hasil' && !tok()) { next[st] = DB[st] || []; continue; }
    let data, error;
    if (PROT.includes(st)) ({ data, error } = await sb.rpc('app_ambil', { p_token: tok(), p_store: st }));
    else if (['mapel', 'bab', 'soal', 'ujian', 'modul', 'paket_html', 'gambar'].includes(st)) ({ data, error } = await sb.rpc('app_konten', { p_token: tok(), p_store: st }));
    else if (st === 'kelas') ({ data, error } = await sb.from('kelas').select('id,nama,urutan,kunci_aktif'));
    else ({ data, error } = await sb.from(st).select('*'));
    if (error) {
      if (st === 'paket_html' || st === 'akun_tentor' || PORTAL_STORES.includes(st)) {
        if (st === 'akun_tentor') window._tentorCloudError = tentorErrMsg(error);
        if (PORTAL_STORES.includes(st)) window._portalCloudError = portalErrMsg(error);
        next[st] = (DB[st] && DB[st].length) ? DB[st] : [];
        continue;
      }
      throw error;
    }
    next[st] = (data || []).map(r => fromSupabaseRow(st, r));
  }
  { // pertahankan nilai lokal yang belum sampai ke server
    const pend = new Set(hasilPending()), srv = next.hasil || [];
    const ada = new Set(srv.map(x => x.id));
    hasilPendingSet([...pend].filter(i => !ada.has(i)));
    next.hasil = srv.concat((DB.hasil || []).filter(h => pend.has(h.id) && !ada.has(h.id)));
  }
  cloudMute = true;
  try { await replaceAll(next, false); }
  finally { cloudMute = false; }
  retryHasilPending().catch(() => {});
}

async function seedSupabaseIfEmpty() {
  if (!tok()) return;
  const { data, error } = await sb.from('kelas').select('id').limit(1);
  if (error) throw error;
  if (!data || !data.length) {
    const seed = buildSeed();
    for (const st of CONTENT_STORES) {
      if (st === 'paket_html' || st === 'akun_murid' || st === 'akun_tentor') continue;
      if (seed[st] && seed[st].length) {
        await rpcTulis(st, seed[st].map(o => toSupabaseRow(st, o)));
      }
    }
  }
}

async function put(store, obj) { return putMany(store, [obj]); }
async function putMany(store, objs) {
  const arr = DB[store] || (DB[store] = []); const idx = new Map(arr.map((x, i) => [x.id, i]));
  objs.forEach(o => { if (idx.has(o.id)) arr[idx.get(o.id)] = o; else { idx.set(o.id, arr.length); arr.push(o); } });
  if (store === 'soal') _sm = null; if (store === 'gambar') _gm = null;
  await persist(() => tx(store, 'readwrite', s => { objs.forEach(o => s.put(o)); }));
  await pushToSupabase(store, objs);
}
async function delMany(store, ids) {
  if (!ids.length) return;
  const set = new Set(ids); DB[store] = (DB[store] || []).filter(x => !set.has(x.id));
  if (store === 'soal') _sm = null; if (store === 'gambar') _gm = null;
  await persist(() => tx(store, 'readwrite', s => { ids.forEach(i => s.delete(i)); }));
  await deleteFromSupabase(store, ids);
}
const del = (store, id) => delMany(store, [id]);

function replaceAll(data, syncCloud = true) {
  const _keepReg = {}; REG_STORES.forEach(s => { _keepReg[s] = DB[s] || []; });
  DB = {
    kelas: data.kelas || [], mapel: data.mapel || [], bab: data.bab || [], soal: data.soal || [],
    ujian: data.ujian || [], modul: data.modul || [], paket_html: data.paket_html || [],
    gambar: data.gambar || [], hasil: data.hasil || [], akun_murid: data.akun_murid || [], akun_tentor: data.akun_tentor || [],
    tagihan: data.tagihan || [], presensi: data.presensi || [], fee_tentor: data.fee_tentor || []
  };
  REG_STORES.forEach(s => { DB[s] = _keepReg[s]; });
  _sm = null; _gm = null;
  const idbPromise = !idb ? Promise.resolve() : new Promise((res, rej) => {
    const t = idb.transaction(STORES, 'readwrite');
    STORES.forEach(st => { const s = t.objectStore(st); s.clear(); (DB[st] || []).forEach(o => s.put(o)); });
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return idbPromise.then(async () => {
    if (syncCloud && !cloudMute) {
      for (const st of CONTENT_STORES) {
        if (DB[st] && DB[st].length) await pushToSupabase(st, DB[st]);
      }
    }
  });
}

function htmlAman(h) {
  const d = new DOMParser().parseFromString('<body>' + String(h || '') + '</body>', 'text/html');
  d.querySelectorAll('script,iframe,object,embed,link,meta,base,form,style').forEach(n => n.remove());
  d.body.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    const k = a.name.toLowerCase(), v = a.value.trim().toLowerCase();
    if (k.startsWith('on') || ((k === 'href' || k === 'src' || k === 'xlink:href') && (/^(javascript|vbscript):/.test(v) || (/^data:/.test(v) && !(k === 'src' && /^data:image\/(png|jpe?g|gif|webp);/.test(v)))))) n.removeAttribute(a.name);
  }));
  return d.body.innerHTML;
}
const isUrl = v => /^(https?:\/\/|data:image\/)/i.test(v || '');
function imgSrc(ref) { if (!ref) return ''; if (isUrl(ref)) return ref; const g = gm().get(String(ref).replace(/^img:/, '')); return g ? g.data : ''; }

async function compressImage(file) {
  if (!/^image\//.test(file.type)) throw new Error('Pilih file gambar (JPG/PNG/SVG)');
  if (file.type === 'image/svg+xml') { if (file.size > 400 * 1024) throw new Error('SVG terlalu besar (maks 400 KB)'); return readDataURL(file); }

  const sc = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}

   DETEKSI SOAL OTOMATIS UNTUK SEMUA JENIS FILE
   html/htm · pdf · docx · xlsx/xls · csv · txt/md/json · gambar · lainnya
   ===================================================================== */
const PAKET_TIPE = {
  html: { ikon: '🌐', label: 'HTML' }, pdf: { ikon: '📕', label: 'PDF' }, docx: { ikon: '📘', label: 'Word' },
  xlsx: { ikon: '📗', label: 'Excel' }, csv: { ikon: '📊', label: 'CSV' }, txt: { ikon: '📝', label: 'Teks' },
  img: { ikon: '🖼️', label: 'Gambar' }, lain: { ikon: '📎', label: 'File' }
};
function fileKind(name, mime) {
  const e = ((String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1]) || '';
  if (e === 'html' || e === 'htm') return 'html';
  if (e === 'pdf' || mime === 'application/pdf') return 'pdf';
  if (e === 'docx') return 'docx';
  if (['xlsx', 'xls', 'xlsm'].includes(e)) return 'xlsx';
  if (e === 'csv') return 'csv';
  if (['txt', 'md', 'json'].includes(e)) return 'txt';
  if (['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].includes(e) || /^image\//.test(mime || '')) return 'img';
  return 'lain';
}
function paketTipe(p) {
  const t = String(p.tipeFile || '').toLowerCase();
  if (PAKET_TIPE[t]) return t;
  if (/^data:application\/pdf/i.test(p.kontenHtml || '')) return 'pdf';
  return p.namaFile ? fileKind(p.namaFile) : 'html';
}

const _libP = {};
function loadScript(url) {
  return _libP[url] || (_libP[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = () => { delete _libP[url]; rej(new Error('Gagal memuat pustaka pembaca file')); };
    document.head.appendChild(s);
  }));
}
function dataUrlToBuf(d) {
  const bin = atob(String(d).split(',')[1] || ''), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function pdfText(dataUrl) {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: dataUrlToBuf(dataUrl) }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let lastY = null, line = '';
    for (const it of tc.items) {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 3) { out += line.trim() + '\n'; line = ''; }
      line += it.str + ' '; lastY = y;
    }
    out += line.trim() + '\n';
  }
  return out;
}
async function docxText(dataUrl) {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  const buf = dataUrlToBuf(dataUrl);
  return (await mammoth.extractRawText({ arrayBuffer: buf.buffer })).value || '';
}

async function delSoalMany(ids) {
  if (!ids.length) return;
  const set = new Set(ids);
  await delMany('soal', ids);
  const upd = [];
  DB.ujian.forEach(u => { if ((u.soalIds || []).some(i => set.has(i))) { u.soalIds = u.soalIds.filter(i => !set.has(i)); upd.push(u); } });

  await del('mapel', id);

const isImgIkon = v => /^img:/.test(v || '');
function ikonInner(m) {

async function compressLogo(file) {
  if (!/^image\//.test(file.type)) throw new Error('Pilih file gambar (JPG, PNG, WEBP, atau SVG)');
  if (file.type === 'image/svg+xml') { if (file.size > 300 * 1024) throw new Error('SVG terlalu besar (maks 300 KB)'); return readDataURL(file); }
  const url = await readDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak bisa dibaca')); i.src = url; });
  const sc = Math.min(1, 512 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL(/png|webp|gif/.test(file.type) ? 'image/png' : 'image/jpeg', 0.88);
}

async function saveSoal(e, scope, parentId, id) {
  e.preventDefault();
  const q = $('#f_q').value.trim();
  let opts = [0, 1, 2, 3, 4].map(i => $('#f_o' + i).value.trim());
  const has = i => !!(opts[i] || FI.o[i]);
  let last = -1; for (let i = 0; i < 5; i++) if (has(i)) last = i;
  if (!q) return toast('Pertanyaan wajib diisi', 'err');
  if (last < 1) return toast('Isi minimal 2 pilihan jawaban', 'err');
  const kr = document.querySelector('input[name=f_key]:checked'), key = kr ? +kr.value : 0;
  opts = opts.slice(0, last + 1);
  const img = await commitImage(FI.q), optImgs = [];
  for (let i = 0; i <= last; i++) optImgs.push(await commitImage(FI.o[i]));
  const data = { q, options: opts, key, pembahasan: $('#f_p').value.trim(), img, optImgs: optImgs.some(Boolean) ? optImgs : [] };
  if (id) { const x = get('soal', id); Object.assign(x, data); await put('soal', x); }
  else {
    const x = { id: uid(), scope, parentId, ...data }; await put('soal', x);
    if (scope === 'ujian') { const u = get('ujian', parentId); u.soalIds.push(x.id); await put('ujian', u); }
  }
  await gcGambar(); closeModal(); toast('Soal tersimpan'); render();
}

function ARS_ENGINE(){

  function lev(a, b){
    var m = a.length, n = b.length, i, j, p = [], c, t;
    for (j = 0; j <= n; j++) p[j] = j;
    for (i = 1; i <= m; i++){ c = [i]; for (j = 1; j <= n; j++){ t = a.charAt(i-1) === b.charAt(j-1) ? 0 : 1; c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + t); } p = c; }
    return p[n];

    if (a === b) return true;
    if (!tol) return false;
    var L = Math.max(a.length, b.length);
    if (L < 4 || /^\d+$/.test(a) || /^\d+$/.test(b)) return false;
    return lev(a, b) <= (L >= 8 ? 2 : 1);
  }
  function ada(tokens, teks, frasa, tol){

    if (teks.indexOf(f) > -1) return true;

      ok = false;
      for (j = 0; j < tokens.length; j++){ if (mirip(ft[i], tokens[j], tol)){ ok = true; break; } }
      if (!ok) return false;
    }
    return true;
  }
  function himpunan(x){
    if (x == null || x === '') return [];
    if (!Array.isArray(x)) x = [x];
    return x.map(function(v){ return String(v).trim().toLowerCase(); }).filter(Boolean).sort();
  }
  function sama(a, b){ return a.length === b.length && a.every(function(v, i){ return v === b[i]; }); }
  function res(p, x, kosong){ return { p: p, x: x, k: kosong ? 1 : 0, ok: p >= x }; }

  /* PG: benar 1, salah/kosong 0 */
  A.pg = function(jawab, kunci){
    var kosong = jawab == null || jawab === '';
    return res(!kosong && String(jawab).trim().toLowerCase() === String(kunci).trim().toLowerCase() ? 1 : 0, 1, kosong);
  };
  /* PG kompleks (MCMA): benar semua 2 poin; benar sebagian 1 poin (ada yang benar & tidak ada pilihan salah) */
  A.mcma = function(jawab, kunci){

  A.jodoh = function(jawab, kunci){

    ks.forEach(function(i){

  };
  /* Isian: 1 poin jika benar. kunci boleh array alternatif. inggris:true = tanpa toleransi typo */
  A.isian = function(jawab, kunci, opt){

  };
  /* Uraian: 4 = gagasan utama masuk, 2 = mendekati, 1 = salah tapi dijawab, 0 = kosong.

  A.nilai = function(it){

    if (typeof window.ARS_kirimSkor === 'function') window.ARS_kirimSkor(d);
    return out;
  };
}

      p: Math.max(0, Number(x.p) || 0), x: Math.max(0, Number(x.x) || 0), k: x.k ? 1 : 0

const _normNama = x => String(x || '').trim().toLowerCase().replace(/\s+/g, ' ');
// Baris rekap sesuai peran: admin = semua, murid = miliknya, tentor = murid yang ditangani
function getRekapRows() {
  let rows = [...(DB.hasil || [])].sort((a, b) => String(b.waktu).localeCompare(String(a.waktu)));
  if (isAdmin()) return rows;
  const m = getMuridSession();
  if (m) return rows.filter(h => h.muridId ? h.muridId === m.id : _normNama(h.nama) === _normNama(m.nama));
  const t = getTentorSession();
  if (t) {
    // hanya murid yang ditangani tentor ini; belum ada murid = rekap kosong
    const ids = new Set((t.muridIds || []).map(String));
    if (!ids.size) return [];
    const namaSet = new Set((DB.akun_murid || []).filter(a => ids.has(String(a.id))).map(a => _normNama(a.nama)));
    return rows.filter(h => h.muridId ? ids.has(String(h.muridId)) : namaSet.has(_normNama(h.nama)));
  }
  return [];
}
function exportRekapCSV() {

/* Materi yang paling banyak salah (umum): dari detail per butir; rekap lama memakai judul paket */
function _materiUmum(t) { return String(t || 'Lainnya').replace(/^\s*(latihan|ujian|try ?out)?\s*bab\s*\d+\s*[:\-–.]?\s*/i, '').trim() || String(t || 'Lainnya'); }
function analisisMateri(rows) {
  const mp = {};
  const tambah = (k, salah, total) => { k = _materiUmum(k); const o = mp[k] || (mp[k] = { salah: 0, total: 0 }); o.salah += salah; o.total += total; };
  rows.forEach(h => {
    const d = Array.isArray(h.jawab) ? h.jawab.filter(x => x && x.m !== undefined && x.x !== undefined) : [];
    if (d.length) d.forEach(x => tambah(x.m || h.judul, Number(x.p) < Number(x.x) ? 1 : 0, 1));
    else {
      const tot = Number(h.total) || 0; if (!tot) return;
      const sal = (Number(h.salah) || 0) + (Number(h.kosong) || 0) || Math.max(0, tot - (Number(h.benar) || 0));
      tambah(h.judul || h.mapel, sal, tot);
    }
  });
  return Object.entries(mp).map(([m, o]) => ({ m, ...o })).filter(o => o.salah > 0).sort((a, b) => b.salah - a.salah || b.salah / b.total - a.salah / a.total).slice(0, 3);
}
function kartuMateriSalah(rows, untuk) {
  if (isAdmin()) return '';
  const top = analisisMateri(rows);
  if (!top.length) return '';
  const mx = top[0].salah;
  return `<div class="p-4 rounded-2xl border border-rose-200 bg-rose-50/60 mb-4">
    <div class="font-extrabold text-rose-800">📌 Materi yang paling banyak salah${untuk ? ' · ' + esc(untuk) : ''}</div>
    <p class="text-sm text-slate-700 mt-1">Paling banyak salah di materi <b>${esc(top[0].m)}</b> (${top[0].salah} soal salah/kosong). Perlu diulang lebih dulu.</p>
    <div class="mt-2 space-y-2">${top.map(o => `<div><div class="flex justify-between text-xs font-bold text-slate-700"><span>${esc(o.m)}</span><span>${o.salah} dari ${o.total} soal</span></div><div class="mat-bar"><i style="width:${Math.max(6, Math.round(o.salah / mx * 100))}%"></i></div></div>`).join('')}</div>
  </div>`;
}

/* Evaluasi penguasaan materi per pengerjaan (batas persen bisa diubah di sini) */
const BATAS_MENGUASAI = 85, BATAS_LATIH = 60;
function statusMateri(pct) {
  if (pct >= BATAS_MENGUASAI) return { t: 'Sudah menguasai', c: 'bg-emerald-100 text-emerald-800', ic: '✅' };
  if (pct >= BATAS_LATIH) return { t: 'Sudah menguasai, tetapi harus berlatih', c: 'bg-amber-100 text-amber-800', ic: '🟡' };
  return { t: 'Belum menguasai', c: 'bg-rose-100 text-rose-800', ic: '🔴' };
}
function evalMateri(h) {
  const mp = {}, urut = [];
  const add = (k, p, x) => { k = _materiUmum(k); if (!mp[k]) { mp[k] = { m: k, p: 0, x: 0 }; urut.push(k); } mp[k].p += p; mp[k].x += x; };
  const d = Array.isArray(h.jawab) ? h.jawab.filter(v => v && v.m !== undefined && Number(v.x) > 0) : [];
  if (d.length) d.forEach(v => add(v.m || h.judul, Number(v.p) || 0, Number(v.x) || 0));
  else if (Number(h.total) > 0) add(h.judul || h.mapel, Number(h.benar) || 0, Number(h.total) || 0);
  return urut.map(k => { const o = mp[k], pct = Math.round(o.p / o.x * 100); return { ...o, pct, st: statusMateri(pct) }; })
    .sort((a, b) => a.pct - b.pct);
}
function ringkasEvalText(h) { return evalMateri(h).map(e => e.m + ': ' + e.st.t).join('; '); }
function bukaEvaluasi(id) {
  const h = (DB.hasil || []).find(x => String(x.id) === String(id)); if (!h) return;
  const ev = evalMateri(h);
  openModal(`<div class="p-6 space-y-3"><div><h3 class="font-extrabold text-xl">🧭 Evaluasi Penguasaan Materi</h3>
    <p class="text-sm text-slate-600">${esc(h.nama)} · ${esc(h.judul)} · Nilai <b>${h.nilai}</b> (${h.benar}/${h.total} poin)</p></div>
    ${ev.length ? ev.map(e => `<div class="p-3 rounded-2xl border border-slate-200"><div class="flex justify-between gap-2 items-center"><b>${esc(e.m)}</b><span class="text-xs font-bold text-slate-500">${e.p}/${e.x} poin · ${e.pct}%</span></div><div class="mt-1.5"><span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full ${e.st.c}">${e.st.ic} ${e.st.t}</span></div></div>`).join('') : '<p class="text-slate-500">Belum ada data materi untuk pengerjaan ini.</p>'}
    <p class="text-xs text-slate-500">Patokan: ≥${BATAS_MENGUASAI}% sudah menguasai · ${BATAS_LATIH}–${BATAS_MENGUASAI - 1}% sudah menguasai tetapi harus berlatih · &lt;${BATAS_LATIH}% belum menguasai.</p>
    <div class="login-actions"><button type="button" class="btn btn-primary btn-block" onclick="closeModal()">Tutup</button></div></div>`);
}

/* Palet per Grade: [utama, aksen] — dipakai di beranda & seluruh halaman di bawah kelas tsb */
const GRADE_PALETTES = [
  ['#0E9F8E','#FFB020'],['#7C5CE0','#FF8A5B'],['#2FB462','#FF6F91'],['#F08A0C','#1FA7A0'],
  ['#E8466F','#2FB462'],['#1C9BD1','#FFB020'],['#F2703A','#3A7BD5'],['#3B6FE0','#FFC233'],
  ['#7DAF1C','#8E5CE0'],['#D6409F','#14B8A6'],['#00A878','#FF8A3D'],['#C2693B','#2E86C1']
];
function gradePalette(i){ const g = GRADE_PALETTES[((i % GRADE_PALETTES.length) + GRADE_PALETTES.length) % GRADE_PALETTES.length]; return { c: g[0], a: g[1] }; }
function applyGradeTheme(kelasId){
  const r = document.documentElement.style;
  if (!kelasId) { ['--green','--green-d','--green-h','--gold','--gold-h','--goldl','--ring','--hdr1','--hdr2','--tint','--tint-ink','--ivory','--line','--line2','--ink'].forEach(k => r.removeProperty(k)); return; }
  const idx = sortBy(DB.kelas).findIndex(k => String(k.id) === String(kelasId)); if (idx < 0) return;
  const { c, a } = gradePalette(idx), rgb = parseInt(c.slice(1),16);
  r.setProperty('--green', c); r.setProperty('--green-d', _mix(c,0,.34)); r.setProperty('--green-h', _mix(c,0,.12));
  r.setProperty('--gold', a); r.setProperty('--gold-h', _mix(a,0,.12)); r.setProperty('--goldl', _mix(a,255,.55));
  r.setProperty('--ring', `rgba(${rgb>>16&255},${rgb>>8&255},${rgb&255},.22)`);
  r.setProperty('--hdr1', c); r.setProperty('--hdr2', _mix(c,0,.3));
  r.setProperty('--tint', _mix(a,255,.78)); r.setProperty('--tint-ink', _mix(a,0,.55));
  r.setProperty('--ivory', _mix(c,255,.92)); r.setProperty('--line', _mix(c,255,.82)); r.setProperty('--line2', _mix(c,255,.65)); r.setProperty('--ink', _mix(c,0,.8));
}

function portalErrMsg(err) {
  const m = String((err && (err.message || err.details || err.hint)) || err || '');

  if (/PGRST205|42P01|schema cache|does not exist|relation/i.test(m + ' ' + c)) return 'Tabel tagihan/presensi/fee belum dibuat di Supabase. Jalankan supabase_portal_akun.sql di Supabase → SQL Editor.';
  if (/42501|row-level security|permission denied|policy/i.test(m + ' ' + c)) return 'Akses ditolak (RLS). Jalankan ulang supabase_portal_akun.sql.';

async function loadCoverImage() {

async function compressCover(file) {
  if (!/^image\//.test(file.type) || file.type === 'image/svg+xml') throw new Error('Pilih file gambar JPG / PNG / WEBP');
  const url = await readDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak bisa dibaca')); i.src = url; });
  const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let q = .82, data = c.toDataURL('image/jpeg', q);
  while (data.length * .75 > 700 * 1024 && q > .4) { q -= .1; data = c.toDataURL('image/jpeg', q); }
  return data;
}

  const inner = `<span class="ic">${icon}</span><h3>${title}</h3><p>${desc}</p>`;
  return /^#\//.test(go) ? `<a class="tile" style="--tc:${color}" href="${go}">${inner}</a>` : `<button type="button" class="tile" style="--tc:${color}" onclick="${go}">${inner}</button>`;
}

    tiles += tile('#/kelola-tentor', '💼', 'Presensi &amp; Fee Tentor', 'Kelola presensi &amp; status pembayaran fee', '#7C5CE0');

/* ---------- Berkas (invoice / presensi / bukti) ---------- */
async function prosesBerkas(file) {
  const MAX = 1.5 * 1024 * 1024;
  if (/^image\//.test(file.type) && file.type !== 'image/svg+xml') {
    const url = await readDataURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak bisa dibaca')); i.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    let q = .82, data = c.toDataURL('image/jpeg', q);
    while (data.length * .75 > MAX && q > .4) { q -= .1; data = c.toDataURL('image/jpeg', q); }
    if (data.length * .75 > MAX) throw new Error('Gambar terlalu besar (maks 1,5 MB)');
    return { nama: file.name.replace(/\.[^.]+$/, '') + '.jpg', data };
  }
  if (file.type === 'application/pdf') {
    if (file.size > MAX) throw new Error('PDF terlalu besar (maks 1,5 MB)');
    return { nama: file.name, data: await readDataURL(file) };
  }
  throw new Error('Format berkas harus PDF atau gambar (JPG/PNG)');
}
async function bukaBerkas(store, id) {
  const it = get(store, id);
  if (!it || !it.fileData) return toast('Berkas tidak tersedia', 'warn');
  const w = window.open('', '_blank');
  try {
    const blob = await (await fetch(it.fileData)).blob();
    const url = URL.createObjectURL(blob);
    if (w) w.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = it.fileNama || 'berkas'; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) { if (w) w.close(); toast('Berkas gagal dibuka', 'err'); }
}

const stat = (lbl, val, color, sub) => `<div class="stat" style="--sc:${color}"><small>${lbl}</small><b>${val}</b>${sub ? `<div class="text-xs text-slate-500">${sub}</div>` : ''}</div>`;
const presensiOf = (type, id) => (DB.presensi || []).filter(p => p.ownerType === type && p.ownerId === id).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

function finPage(o) {
  const T = o.store === 'tagihan';
  const lb = T ? { b: 'Tagihan Belum Dibayar', l: 'Tagihan Sudah Dibayar', add: '➕ Tambah Tagihan' } : { b: 'Fee Belum Dibayar', l: 'Fee Sudah Dibayar', add: '➕ Tambah Fee' };
  const belum = o.items.filter(x => x.status !== 'lunas').sort((a, b) => String(a.jatuhTempo || a.createdAt || '').localeCompare(String(b.jatuhTempo || b.createdAt || '')));
  const lunas = o.items.filter(x => x.status === 'lunas').sort((a, b) => String(b.tglBayar || '').localeCompare(String(a.tglBayar || '')));
  const sum = a => a.reduce((s, x) => s + (Number(x.jumlah) || 0), 0);
  let h = `<div class="grid gap-3 sm:grid-cols-3 mb-2">${stat('Total ' + lb.b, fmtRp(sum(belum)), '#E8466F', belum.length + ' item')}${stat('Total ' + lb.l, fmtRp(sum(lunas)), '#2FB462', lunas.length + ' item')}${stat('Jumlah Keseluruhan', fmtRp(sum(o.items)), '#1C9BD1', o.items.length + ' item')}</div>`;
  h += `<div class="sec-h"><h3>⏳ ${lb.b}</h3>${o.adm ? `<button type="button" class="btn btn-primary btn-sm" onclick="finForm('${o.store}','${esc(o.ownerId)}','')">${lb.add}</button>` : ''}</div>`;
  h += belum.length ? belum.map(x => finCard(x, o.store, o.adm)).join('') : `<div class="empty">Tidak ada ${lb.b.toLowerCase()}.</div>`;
  h += `<div class="sec-h"><h3>✅ ${lb.l}</h3></div>`;
  h += lunas.length ? lunas.map(x => finCard(x, o.store, o.adm)).join('') : `<div class="empty">Belum ada pembayaran tercatat.</div>`;
  h += `<div class="sec-h"><h3>📋 Presensi</h3>${o.adm ? `<button type="button" class="btn btn-primary btn-sm" onclick="presensiForm('${o.ownerType}','${esc(o.ownerId)}','')">⬆️ Unggah Presensi</button>` : ''}</div>`;
  h += o.pres.length ? o.pres.map(p => presensiCard(p, o.adm)).join('') : `<div class="empty">Belum ada data presensi.</div>`;
  if (!o.adm) h += `<p class="text-xs text-slate-500 mt-3">ℹ️ Data ini diunggah dan dikelola oleh Admin. Anda hanya dapat melihatnya.</p>`;
  return h;
}

  const opts = list.map(a => { const k = isM ? get('kelas', a.kelasId) : null; return `<option value="${esc(a.id)}" ${a.id === id ? 'selected' : ''}>${esc(a.nama)} (@${esc(a.username)})${k ? ' — ' + esc(k.nama) : ''}</option>`; }).join('');

async function simpanPortal(store, obj, label) {
  try { await put(store, obj); toast(label + ' tersimpan', 'ok'); }
  catch (err) { window._portalCloudError = portalErrMsg(err); toast(label + ' tersimpan di perangkat ini saja, GAGAL ke server: ' + window._portalCloudError, 'err'); }
  closeModal(); render();
}
async function saveFin(e, store, ownerId, id) {
  e.preventDefault(); if (!isAdmin()) return toast('Hanya Admin yang dapat mengubah data ini', 'err');
  const T = store === 'tagihan', old = id ? get(store, id) : null;
  let fileNama = old ? old.fileNama || '' : '', fileData = old ? old.fileData || '' : '';
  try {
    const f = $('#fn_file').files[0];
    if (f) { const r = await prosesBerkas(f); fileNama = r.nama; fileData = r.data; }
    else if ($('#fn_hapusfile') && $('#fn_hapusfile').checked) { fileNama = ''; fileData = ''; }
  } catch (err) { return toast(err.message, 'err'); }
  const status = $('#fn_status').value;
  let tglBayar = ($('#fn_tgl').value || '').trim();
  if (status === 'lunas' && !tglBayar) tglBayar = todayISO();
  if (status !== 'lunas') tglBayar = '';
  const now = new Date().toISOString();
  const obj = {
    id: id || ((T ? 'tg_' : 'fe_') + uid()), [T ? 'muridId' : 'tentorId']: ownerId,
    judul: ($('#fn_judul').value || '').trim(), periode: ($('#fn_periode').value || '').trim(), jumlah: Number($('#fn_jumlah').value) || 0,
    status, tglBayar, keterangan: ($('#fn_ket').value || '').trim(), fileNama, fileData,
    createdAt: old ? old.createdAt || now : now, updatedAt: now
  };
  if (T) obj.jatuhTempo = $('#fn_tempo').value || '';
  await simpanPortal(store, obj, T ? 'Tagihan' : 'Fee');
}
function presensiForm(ownerType, ownerId, id) {
  if (!isAdmin()) return toast('Hanya Admin yang dapat mengubah data ini', 'err');
  const it = id ? get('presensi', id) : null;
  openModal(`<form class="p-6 space-y-3" onsubmit="savePresensi(event,'${esc(ownerType)}','${esc(ownerId)}','${esc(id || '')}')">
    <h3 class="font-extrabold text-xl">${it ? 'Edit' : 'Unggah'} Presensi</h3>
    <div><label class="lbl">Periode</label><input id="pr_periode" class="inp" required value="${esc(it ? it.periode : '')}" placeholder="Contoh: November 2026"></div>
    <div><label class="lbl">Keterangan</label><textarea id="pr_ket" class="inp" rows="3" placeholder="Contoh: Hadir 12 dari 14 pertemuan">${esc(it ? it.keterangan : '')}</textarea></div>
    <div><label class="lbl">Unggah Berkas Presensi (PDF / gambar, maks 1,5 MB)</label><input id="pr_file" type="file" accept=".pdf,image/*" class="inp">
      ${it && it.fileData ? `<label class="flex items-center gap-2 text-sm mt-1"><input type="checkbox" id="pr_hapusfile"> Hapus berkas saat ini (${esc(it.fileNama)})</label>` : ''}</div>
    <div class="flex gap-2 justify-end"><button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-ok">Simpan</button></div>
  </form>`);
}
async function savePresensi(e, ownerType, ownerId, id) {
  e.preventDefault(); if (!isAdmin()) return toast('Hanya Admin yang dapat mengubah data ini', 'err');
  const old = id ? get('presensi', id) : null;
  let fileNama = old ? old.fileNama || '' : '', fileData = old ? old.fileData || '' : '';
  try {
    const f = $('#pr_file').files[0];
    if (f) { const r = await prosesBerkas(f); fileNama = r.nama; fileData = r.data; }
    else if ($('#pr_hapusfile') && $('#pr_hapusfile').checked) { fileNama = ''; fileData = ''; }
  } catch (err) { return toast(err.message, 'err'); }
  const keterangan = ($('#pr_ket').value || '').trim();
  if (!fileData && !keterangan) return toast('Isi keterangan atau unggah berkas presensi', 'err');
  const now = new Date().toISOString();
  await simpanPortal('presensi', { id: id || ('pr_' + uid()), ownerType, ownerId, periode: ($('#pr_periode').value || '').trim(), keterangan, fileNama, fileData, createdAt: old ? old.createdAt || now : now, updatedAt: now }, 'Presensi');
}
function hapusPortal(store, id) {
  if (!isAdmin()) return toast('Hanya Admin yang dapat mengubah data ini', 'err');
  askConfirm('Hapus data ini? Tindakan tidak dapat dibatalkan.', async () => {
    try { await del(store, id); toast('Data dihapus', 'ok'); }
    catch (err) { window._portalCloudError = portalErrMsg(err); toast('Dihapus di perangkat ini, GAGAL di server: ' + window._portalCloudError, 'err'); }
    render();
  });
}

/* =====================================================================
   PENDAFTARAN TENTOR & MURID BARU
   Alur: formulir -> validasi -> ringkasan konfirmasi -> simpan (IndexedDB +
   Supabase) -> layar sukses + opsi kirim ringkasan ke WhatsApp.
   Bila tabel Supabase belum dibuat, data tetap aman di IndexedDB perangkat
   dan dikirim ulang otomatis (atau lewat tombol "Coba Kirim Ulang").

   ---------------------------------------------------------------------
   SQL SUPABASE (salin ke Supabase -> SQL Editor; juga tersedia di berkas
   supabase_pendaftaran.sql). Aman dijalankan berulang.
   ---------------------------------------------------------------------
   create table if not exists public.pendaftaran_tentor (
     id text primary key, kode text, nama text not null,
     tempat_lahir text, tgl_lahir text, pendidikan text, agama text,
     alamat text, no_hp text, kemampuan_khusus text, pengalaman text,
     program jsonb default '[]'::jsonb, program_lain text default '',
     melamar_sebagai text, cv_nama text default '', cv_data text default '',
     setuju boolean default false, tgl_setuju timestamptz,
     status_proses text default 'baru', catatan_admin text default '',
     created_at timestamptz default now(), updated_at timestamptz default now()

function tglCheck(v, minAge, maxAge) {
  if (!v) return 'Tanggal lahir wajib diisi.';

  const now = new Date(); if (d > now) return 'Tanggal lahir tidak boleh di masa depan.';

}
function regErrMsg(err) {

  if (/fetch|network|Failed to fetch|timeout/i.test(m)) return 'Tidak ada koneksi internet / Supabase tidak terjangkau.';

/* ---------- Penyimpanan: IndexedDB + Supabase ---------- */
const idbPutReg = (st, o) => persist(() => tx(st, 'readwrite', s => { s.put(o); }));
async function kirimKeCloud(store, obj) {
  try {
    const { data: _d, error } = await sb.rpc('app_daftar', { p_store: store, p_row: regToRow(store, obj) });
    if (error) throw error;
    if (_d && _d.ok === false) throw new Error(_d.err || 'Gagal mengirim');
    obj.synced = true; await idbPutReg(store, obj);
    return { ok: true };
  } catch (err) {
    console.error('Pendaftaran gagal dikirim ke Supabase (' + store + '):', err);
    return { ok: false, msg: regErrMsg(err) };
  }
}
async function simpanPendaftaran(store, obj) {
  obj.synced = false;
  const arr = DB[store] || (DB[store] = []); const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.unshift(obj);
  await idbPutReg(store, obj);
  return kirimKeCloud(store, obj);
}
async function syncPendingRegistrasi() {
  for (const st of REG_STORES) for (const o of (DB[st] || []).filter(x => x.synced === false)) await kirimKeCloud(st, o);
}
async function loadPendaftarCloud() {
  window._regCloudError = '';
  if (!isAdmin()) return;
  for (const st of REG_STORES) {
    const { data, error } = await sb.rpc('app_admin_ambil', { p_token: tok(), p_store: st });
    if (error) { window._regCloudError = regErrMsg(error); continue; }
    const remote = (data || []).map(r => regFromRow(st, r)), ids = new Set(remote.map(r => r.id));
    DB[st] = [...remote, ...(DB[st] || []).filter(x => x.synced === false && !ids.has(x.id))];
    await persist(() => tx(st, 'readwrite', s => { s.clear(); DB[st].forEach(o => s.put(o)); }));
  }
}

/* ---------- Interaksi formulir ---------- */
function toggleReguler() {
  const on = $('#m_prog_reg').checked; $('#m_mapel_box').style.display = on ? 'block' : 'none';
  if (!on) document.querySelectorAll('input[name="m_mapel"]').forEach(c => c.checked = false);
  updMapelLimit();
}
function updMapelLimit() {
  const cs = [...document.querySelectorAll('input[name="m_mapel"]')], n = cs.filter(c => c.checked).length;
  cs.forEach(c => { const lock = !c.checked && n >= 3; c.disabled = lock; c.closest('.pick').classList.toggle('dis', lock); });
  $('#mapelCount').textContent = n + ' / 3 dipilih'; $('#mapelWarn').style.display = n >= 3 ? 'block' : 'none';
}
function mapelLockedHint(lbl) { const i = lbl.querySelector('input'); if (i && i.disabled) toast('Maksimal 3 mapel reguler. Lepas salah satu terlebih dahulu.', 'warn'); }
const togSesi = () => { $('#m_sesi_box').style.display = rrad('m_sesi') === 'lain' ? 'block' : 'none'; };
const togSumber = () => { $('#m_sumber_box').style.display = rrad('m_sumber') === 'Lainnya' ? 'block' : 'none'; };
function syncAlamat() {
  const cb = $('#m_sama'), a = $('#m_alamat_anak'); if (!cb || !a) return;
  if (cb.checked) { a.value = $('#m_alamat_ortu').value; a.readOnly = true; } else a.readOnly = false;
}
function paintFoto() {
  const b = $('#fotoBox'); if (!b) return;
  b.innerHTML = REGF.foto
    ? `<img class="fotoprev" src="${esc(REGF.foto.data)}" alt="Pratinjau foto anak"><div class="text-sm"><b>${esc(REGF.foto.nama)}</b><br><span class="text-slate-500">${(REGF.foto.size / 1024).toFixed(0)} KB</span><br><button type="button" class="btn btn-ghost btn-sm mt-2" onclick="hapusFoto()">Hapus foto</button></div>`
    : `<div class="fotoph">👦</div><div class="text-sm text-slate-500">Belum ada foto dipilih.<br>Format JPG / PNG / WEBP, <b>maksimal 1 MB</b>.</div>`;
}
function hapusFoto() { REGF.foto = null; const i = $('#m_foto_in'); if (i) i.value = ''; paintFoto(); setErr('m_foto_in', ''); }
async function pickFoto(inp) {
  const f = inp.files && inp.files[0]; setErr('m_foto_in', ''); if (!f) return;
  if (!/^image\/(jpeg|png|webp)$/i.test(f.type)) { inp.value = ''; REGF.foto = null; paintFoto(); return setErr('m_foto_in', 'Format foto harus JPG, PNG, atau WEBP.'); }
  if (f.size > FOTO_MAX) {
    const mb = (f.size / 1048576).toFixed(2).replace('.', ','); inp.value = ''; REGF.foto = null; paintFoto();
    toast('Foto terlalu besar (' + mb + ' MB). Maksimal 1 MB.', 'warn');
    return setErr('m_foto_in', `Ukuran foto ${mb} MB melebihi batas 1 MB. Perkecil / kompres foto, lalu pilih ulang.`);
  }
  try { REGF.foto = { nama: f.name, data: await readDataURL(f), size: f.size }; paintFoto(); }
  catch (e) { inp.value = ''; REGF.foto = null; paintFoto(); setErr('m_foto_in', e.message || 'Foto gagal dibaca.'); }
}
function paintCv() {
  const b = $('#cvInfo'); if (!b) return;
  b.innerHTML = REGF.cv ? `📄 <b>${esc(REGF.cv.nama)}</b> (${(REGF.cv.size / 1024).toFixed(0)} KB) <button type="button" class="btn btn-ghost btn-sm ml-2" onclick="hapusCv()">Hapus</button>` : 'Belum ada berkas dipilih.';
}
function hapusCv() { REGF.cv = null; const i = $('#t_cv_in'); if (i) i.value = ''; paintCv(); setErr('t_cv_in', ''); }
async function pickCv(inp) {
  const f = inp.files && inp.files[0]; setErr('t_cv_in', ''); if (!f) return;
  if (!/\.(pdf|docx?|jpe?g|png|webp)$/i.test(f.name)) { inp.value = ''; REGF.cv = null; paintCv(); return setErr('t_cv_in', 'Format CV harus PDF, DOC/DOCX, atau gambar JPG/PNG/WEBP.'); }
  if (f.size > CV_MAX) { const mb = (f.size / 1048576).toFixed(2).replace('.', ','); inp.value = ''; REGF.cv = null; paintCv(); toast('CV terlalu besar (' + mb + ' MB). Maksimal 2 MB.', 'warn'); return setErr('t_cv_in', `Ukuran CV ${mb} MB melebihi batas 2 MB.`); }
  try { REGF.cv = { nama: f.name, data: await readDataURL(f), size: f.size }; paintCv(); }
  catch (e) { inp.value = ''; REGF.cv = null; paintCv(); setErr('t_cv_in', e.message || 'Berkas gagal dibaca.'); }
}

/* ---------- Validasi & pengumpulan data ---------- */
function collectTentor() {
  clearErrs(); const E = [], add = (id, m) => E.push([id, m]);
  const d = { nama: rv('t_nama'), hp: normHp(rv('t_hp')), tempatLahir: rv('t_tempat'), tglLahir: rv('t_tgl'), pendidikan: rv('t_pend'), agama: rv('t_agama'), alamat: rv('t_alamat'), kemampuan: rv('t_skill'), pengalaman: rv('t_exp') };
  if (d.nama.length < 3 || !/\p{L}/u.test(d.nama)) add('t_nama', 'Nama lengkap minimal 3 huruf.');
  if (!hpOk(rv('t_hp'))) add('t_hp', 'Nomor HP / WhatsApp tidak valid. Contoh: 081234567890.');
  if (d.tempatLahir.length < 2) add('t_tempat', 'Tempat lahir wajib diisi.');
  const tg = tglCheck(d.tglLahir, 15, 80); if (tg) add('t_tgl', tg);
  if (!d.pendidikan) add('t_pend', 'Pilih pendidikan terakhir.');
  if (!d.agama) add('t_agama', 'Pilih agama.');
  if (d.alamat.length < 10) add('t_alamat', 'Alamat wajib diisi lengkap (minimal 10 karakter).');
  if (!d.kemampuan) add('t_skill', 'Isi kemampuan khusus (tulis “-” bila tidak ada).');
  if (!d.pengalaman) add('t_exp', 'Isi pengalaman mengajar (tulis “Belum ada” bila belum berpengalaman).');
  const program = rchk('t_prog'), lainOn = $('#t_lain_chk').checked, lain = lainOn ? rv('t_lain') : '';
  if (lainOn && lain.length < 2) add('g_tprog', 'Tuliskan program / mata pelajaran “Lainnya”, atau hilangkan centangnya.');
  else if (!program.length && !lain) add('g_tprog', 'Pilih minimal satu program / mata pelajaran.');
  const melamar = rrad('t_melamar'); if (!melamar) add('g_tmelamar', 'Pilih status melamar: Tentor Tetap atau Tentor Freelance.');
  if (!$('#t_setuju').checked) add('g_tsetuju', 'Centang lembar persetujuan untuk melanjutkan.');
  if (!applyErrs(E)) return null;
  const now = new Date().toISOString();
  return Object.assign(d, { id: 'rt_' + uid(), kode: makeKode('RT'), program, programLain: lain, melamarSebagai: melamar, cvNama: REGF.cv ? REGF.cv.nama : '', cvData: REGF.cv ? REGF.cv.data : '', setuju: true, tglSetuju: now, statusProses: 'baru', catatanAdmin: '', createdAt: now, updatedAt: now, synced: false });
}
function collectMurid() {
  clearErrs(); const E = [], add = (id, m) => E.push([id, m]);
  const d = { ayah: rv('m_ayah'), ibu: rv('m_ibu'), pekerjaan: rv('m_kerja'), hp: normHp(rv('m_hp')), alamatOrtu: rv('m_alamat_ortu'), agamaOrtu: rv('m_agama_ortu'), namaAnak: rv('m_anak'), tempatLahir: rv('m_tempat'), tglLahir: rv('m_tgl'), alamatAnak: rv('m_alamat_anak'), agamaAnak: rv('m_agama_anak'), kesehatan: rv('m_sehat'), kelas: rv('m_kelas'), sekolah: rv('m_sekolah'), tujuan: rv('m_tujuan') };
  if (!d.ayah && !d.ibu) { const m = 'Isi minimal salah satu: nama Ayah atau Ibu (atau nama wali).'; add('m_ayah', m); add('m_ibu', m); }
  if (d.pekerjaan.length < 2) add('m_kerja', 'Pekerjaan wajib diisi.');
  if (!hpOk(rv('m_hp'))) add('m_hp', 'Nomor HP / WhatsApp tidak valid. Contoh: 081234567890.');
  if (d.alamatOrtu.length < 10) add('m_alamat_ortu', 'Alamat wajib diisi lengkap (minimal 10 karakter).');
  if (!d.agamaOrtu) add('m_agama_ortu', 'Pilih agama.');
  if (d.namaAnak.length < 3 || !/\p{L}/u.test(d.namaAnak)) add('m_anak', 'Nama lengkap anak minimal 3 huruf.');
  if (d.tempatLahir.length < 2) add('m_tempat', 'Tempat lahir wajib diisi.');
  const tg = tglCheck(d.tglLahir, 1, 30); if (tg) add('m_tgl', tg);
  if (d.alamatAnak.length < 10) add('m_alamat_anak', 'Alamat anak wajib diisi (minimal 10 karakter), atau centang “sama dengan alamat orang tua”.');
  if (!d.agamaAnak) add('m_agama_anak', 'Pilih agama anak.');
  if (!d.kesehatan) add('m_sehat', 'Isi kondisi kesehatan khusus (tulis “Tidak ada” bila tidak ada).');
  if (REGF.foto && REGF.foto.size > FOTO_MAX) add('m_foto_in', 'Ukuran foto melebihi 1 MB. Pilih ulang foto yang lebih kecil.');
  if (!d.kelas) add('m_kelas', 'Pilih jenjang / kelas.');
  if (d.sekolah.length < 3) add('m_sekolah', 'Nama sekolah wajib diisi.');
  const programs = rchk('m_prog'), mapel = programs.includes('Reguler') ? rchk('m_mapel') : [];
  if (!programs.length) add('g_mprog', 'Pilih minimal satu program.');
  else if (programs.includes('Reguler') && !mapel.length) add('g_mmapel', 'Pilih 1 – 3 mata pelajaran untuk program Reguler.');
  else if (mapel.length > 3) add('g_mmapel', 'Mapel reguler maksimal 3.');
  const perMinggu = rrad('m_minggu'); if (!perMinggu) add('g_mminggu', 'Pilih durasi per minggu.');
  const jenisKelas = rrad('m_jenis'); if (!jenisKelas) add('g_mjenis', 'Pilih jenis kelas: Privat atau Kelompok.');
  const lokasiBelajar = rrad('m_lokasi'); if (!lokasiBelajar) add('g_mlokasi', 'Pilih tempat belajar.');
  const waitingList = rrad('m_wl'); if (!waitingList) add('g_mwl', 'Pilih bersedia atau tidak masuk waiting list bila kuota penuh.');
  let sesi = rrad('m_sesi'), sesiMenit = 0;
  if (!sesi) add('g_msesi', 'Pilih durasi per sesi.');
  else if (sesi === 'lain') { sesiMenit = Number(rv('m_sesi_lain')); if (!Number.isInteger(sesiMenit) || sesiMenit < 15 || sesiMenit > 300) add('g_msesi', 'Isi durasi sesi dalam menit (bilangan bulat 15 – 300).'); }

function filterPendaftar(store) {
  const q = PD.q.trim().toLowerCase();
  return [...(DB[store] || [])].sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).filter(o => {
    if (PD.st && (o.statusProses || 'baru') !== PD.st) return false;
    if (!q) return true;
    return (o.kode + ' ' + regRows(store, o).map(s => s.rows.map(r => r[1]).join(' ')).join(' ')).toLowerCase().includes(q);
  });
}
function pendaftarListHtml(store) {

  if (!items.length) return `<div class="empty">${(DB[store] || []).length ? 'Tidak ada data yang cocok dengan filter.' : 'Belum ada pendaftar ' + (T ? 'tentor' : 'murid') + ' yang masuk.'}</div>`;
  return items.map(o => {
    const st = REG_STATUS.find(s => s[0] === (o.statusProses || 'baru')) || REG_STATUS[0];
    const title = T ? o.nama : o.namaAnak;

}

      <div class="flex gap-2 flex-wrap">${T ? '' : `<button type="button" class="btn btn-warn" title="Terapkan aturan kuota penuh: bersedia → Waiting List, tidak bersedia → Ditolak" onclick="terapkanKuotaPenuh('${esc(id)}')">⛔ Kuota Penuh</button>`}<button type="button" class="btn btn-ghost" onclick="cetakPendaftar('${store}','${esc(id)}')">🖨️ Cetak Formulir</button><a class="btn btn-ghost" target="_blank" rel="noopener" href="${waLink(o.hp, 'Halo, kami dari Ar Roemi Sinau menindaklanjuti pendaftaran Anda (' + o.kode + ').')}">💬 Hubungi</a><button type="button" class="btn btn-ok" onclick="simpanStatusPendaftar('${store}','${esc(id)}')">Simpan</button></div></div></div>`, true);
}
async function bukaBerkasReg(store, id, jenis) {
  const o = get(store, id), data = o && (jenis === 'foto' ? o.fotoData : o.cvData); if (!data) return toast('Berkas tidak tersedia', 'warn');
  const w = window.open('', '_blank');
  try {
    const url = URL.createObjectURL(await (await fetch(data)).blob());
    if (w) w.location.href = url; else { const a = document.createElement('a'); a.href = url; a.download = (jenis === 'foto' ? o.fotoNama : o.cvNama) || 'berkas'; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) { if (w) w.close(); toast('Berkas gagal dibuka', 'err'); }
}
function terapkanKuotaPenuh(id) {
  const o = get('pendaftaran_murid', id); if (!o || !isAdmin()) return;
  const mau = o.waitingList === 'Bersedia';
  $('#pd_st').value = mau ? 'waiting' : 'ditolak';
  const c = $('#pd_cat'), note = mau ? 'Kuota penuh — masuk waiting list (orang tua bersedia).' : 'Kuota penuh — ditolak (orang tua tidak bersedia waiting list).';
  c.value = c.value ? c.value + ' | ' + note : note;
  simpanStatusPendaftar('pendaftaran_murid', id);
}
async function simpanStatusPendaftar(store, id) {
  const o = get(store, id); if (!o || !isAdmin()) return;
  o.statusProses = $('#pd_st').value; o.catatanAdmin = ($('#pd_cat').value || '').trim(); o.updatedAt = new Date().toISOString();
  await idbPutReg(store, o);
  const { data: _ok, error } = await sb.rpc('app_admin_status', { p_token: tok(), p_store: store, p_id: id, p_status: o.statusProses, p_catatan: o.catatanAdmin });
  const data = _ok ? [1] : [];
  closeModal();
  if (error) toast('Tersimpan di perangkat ini saja, GAGAL ke server: ' + regErrMsg(error), 'err');
  else if (!data || !data.length) toast('Tersimpan di perangkat ini, tetapi server tidak memperbarui data (cek policy update / data belum tersinkron).', 'warn');
  else toast('Status pendaftar diperbarui', 'ok');
  render();
}
function hapusPendaftar(store, id) {
  if (!isAdmin()) return;
  askConfirm('Hapus data pendaftar ini? Tindakan tidak dapat dibatalkan.', async () => {
    const { error } = await sb.rpc('app_admin_hapus', { p_token: tok(), p_store: store, p_ids: [id] });
    DB[store] = (DB[store] || []).filter(x => x.id !== id);
    await persist(() => tx(store, 'readwrite', s => { s.delete(id); }));
    if (error) toast('Dihapus di perangkat ini, GAGAL di server: ' + regErrMsg(error), 'err'); else toast('Data pendaftar dihapus', 'ok');
    render();
  });
}
function exportPendaftarCSV() {
  const store = regStore(PD.tab), items = filterPendaftar(store);
  if (!items.length) return toast('Tidak ada data untuk diekspor', 'warn');
  const labels = regRows(store, items[0]).flatMap(s => s.rows.map(r => r[0]));
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['Kode', 'Waktu Daftar', 'Status', 'Catatan Admin', ...labels].map(q).join(',')];
  items.forEach(o => lines.push([o.kode, tglWaktu(o.createdAt), o.statusProses || 'baru', o.catatanAdmin || '', ...regRows(store, o).flatMap(s => s.rows.map(r => r[1]))].map(q).join(',')));
  const url = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'pendaftar-' + PD.tab + '-' + todayISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function render() {
  const _hp = (location.hash || '#/').split('/');
  { const _r = currentRole();
    if ((_r === 'tentor' || _r === 'murid') && ['daftar', 'katalog', 'cek', 'pendaftar', 'kelola-katalog', 'kelola-murid', 'kelola-tentor'].includes(_hp[1])) { location.hash = '#/'; return; } }
  if (_hp[1] === 'daftar') { applyGradeTheme(null); renderHeader(); $('#view').innerHTML = viewDaftar(_hp[2]); if (_hp[2] === 'murid') { fillTentorBox(); ensureKatalog(); } return; }
  if (_hp[1] === 'katalog' || _hp[1] === 'cek') { applyGradeTheme(null); renderHeader(); $('#view').innerHTML = _hp[1] === 'katalog' ? viewKatalog() : viewCek(); if (_hp[1] === 'katalog') ensureKatalog(); return; }
  const role = currentRole();
  if (!role) { applyGradeTheme(null); renderHeader(); $('#view').innerHTML = viewLanding(); return; }
  applyGradeTheme(((h)=>{const q=(h||'#/').split('/');return getKelasIdFromRoute(q[1]||'',q[2]);})(location.hash));
  renderHeader();
  const p = (location.hash || '#/').split('/'), route = p[1] || '', id = p[2], tab = p[3];

  const targetKelasId = getKelasIdFromRoute(route, id);
  if (!isAdmin() && targetKelasId && isGradeLocked(targetKelasId)) {
    $('#view').innerHTML = viewHome();
    openGradeKeyModal(targetKelasId, location.hash);
    return;
  }

  const targetMapelId = getMapelIdFromRoute(route, id);
  if (targetMapelId && !isMuridAllowedMapel(targetMapelId)) {
    $('#view').innerHTML = `<div class="card p-8 text-center space-y-3">
      <div class="text-5xl">🚫</div>
      <h3 class="font-extrabold text-xl">Akses Mapel Dibatasi</h3>
      <p class="text-slate-600 text-sm">Akun murid Anda belum diizinkan mengakses mata pelajaran ini.</p>
      <div class="flex gap-2 justify-center"><a class="btn btn-primary" href="#/">⬅ Kembali ke Beranda</a></div>
    </div>`;
    return;
  }

  if ((['kelola-murid', 'kelola-tentor'].includes(route) && role !== 'admin') || (route === 'tagihan' && role !== 'murid') || (route === 'fee' && role !== 'tentor') || (route === 'pendaftar' && role !== 'admin') || (route === 'kelola-katalog' && role !== 'admin')) { location.hash = '#/'; return; }

  let html = '';
  if (route === '') html = viewDashboard(role);
  else if (route === 'bank') html = viewHome();
  else if (route === 'tagihan') html = viewTagihanMurid();
  else if (route === 'fee') html = viewFeeTentor();
  else if (route === 'kelola-murid') html = viewKelola('murid', id);
  else if (route === 'kelola-tentor') html = viewKelola('tentor', id);
  else if (route === 'pendaftar') html = viewPendaftar(id);
  else if (route === 'kelola-katalog') { html = viewKelolaKatalog(); setTimeout(ensureKatalog, 0); }
  else if (route === 'kelas') html = viewKelas(id);
  else if (route === 'mapel') html = viewMapel(id);
  else if (route === 'paket-html') html = viewPaketHtml(id);
  else if (route === 'bab') html = viewBab(id, tab);
  else if (route === 'ujian') html = viewUjian(id);
  else if (route === 'quiz') html = Q && !Q.finished ? viewQuiz() : viewHome();
  else if (route === 'hasil') html = Q && Q.finished ? viewHasil() : viewHome();
  else if (route === 'rekap') html = viewRekap();
  else html = notFound();
  $('#view').innerHTML = html;
  jadwalkanHitung();
  if (role === 'admin' && (route === '' || route === 'pendaftar') && !window._pdLoaded) {
    window._pdLoaded = true;
    loadPendaftarCloud().then(() => { const r = (location.hash || '#/').split('/')[1] || ''; if (r === '' || r === 'pendaftar') render(); }).catch(() => {});
  }
}

  try { idb = await openDB(); await loadAllIDB(); } catch (e) { console.warn(e); }

    let _ok = false;
    if (tok()) { const { data, error } = await sb.rpc('app_cek_sesi', { p_token: tok() }); _ok = error ? (navigator.onLine === false) : !!(data && data.ok); }
    if (!_ok) { sessionStorage.removeItem('sesi_token'); localStorage.removeItem('sesi_token'); sessionStorage.removeItem('admin'); sessionStorage.removeItem('tentor_akun_id'); localStorage.removeItem('murid_akun_id'); }
  } catch (e) { /* offline: biarkan */ }
  try { await loadAdminPin(); } catch (e) { /* tabel pengaturan belum ada: pakai PIN lokal */ }
  try { await loadCoverImage(); } catch (e) { /* gambar cover memakai data lokal */ }
  try {
    await seedSupabaseIfEmpty();
    await pullAllFromSupabase();
  } catch (err) {

    if (!DB.kelas.length) { const _kr = {}; REG_STORES.forEach(s => { _kr[s] = DB[s] || []; }); DB = buildSeed(); REG_STORES.forEach(s => { DB[s] = _kr[s]; }); }
    toast('Gagal memuat dari Supabase, memakai data lokal: ' + err.message, 'warn');
  }
  render();
  syncPendingRegistrasi().catch(() => {});
})();
